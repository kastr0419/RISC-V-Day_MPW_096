# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "inv_dut_096 - 5 V CMOS inverter" # Project title
  author: "kastr0419" # GitHub username
  discord: ""      # Optional: Discord username (for support / communication)
  description: "GF180MCU inverter: pfet_05v0 / nfet_05v0, both W=1.80 um and L=0.60 um."

# ======================================================
# Layout (GDS) configuration
# ======================================================
gds:
  # The top cell name is the DUT name "inv_dut_NNN".
  # It is taken from the layout file name: src/inv_dut_NNN.gds
  # (NNN = DUT_NUM in dut_params.csv)

  # File extension of layout
  extension: "gds"

# ======================================================
# LVS (Layout vs Schematic) configuration
# ======================================================
lvs:
  # Reference netlist extension (LVS/inv_dut_NNN.<extension>, prepared for all DUTs)
  extension: "cdl"

  # If true → only generate extracted netlist (no comparison)
  # If false → perform full LVS comparison
  netlist_only: false

# ======================================================
# PDK configuration (DO NOT MODIFY unless necessary)
# ======================================================
pdk:
  repo: "https://github.com/ishi-kai/gf180mcuD.git"
  ref:  "RD_2611"   # Branch or tag (recommended: fixed tag for reproducibility)
  dir:  "libs.tech" # Rule deck location inside PDK repo

# ======================================================
# Internal version (do not modify)
# ======================================================
yaml_version: 1
